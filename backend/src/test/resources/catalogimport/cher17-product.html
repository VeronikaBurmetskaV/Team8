<!DOCTYPE html>
<!-- Trimmed sample of a Cher'17 product page (Laravel, 17.11.2026). Markup as on the site,
     including raw line breaks inside JSON-LD strings; texts are made up for the tests. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="canonical" href="https://cher17.com/product/puhovik-ukorochenij-chornij">
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CHER'17",
        "url" : "https://cher17.com"
    }
</script>
<script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "Пуховик укорочений з капюшоном чорний",
      "brand":{
         "@type": "Brand",
         "name": "CHER'17"
        },
                      "image": [
                  "https://cher17.fra1.cdn.digitaloceanspaces.com/public/products/media/1/1.jpg",                  "https://cher17.fra1.cdn.digitaloceanspaces.com/public/products/media/2/2.jpg"                 ],
           "description": "<p>На моделі розмір: XS</p>
<p>Температурний режим від 0&deg;C до -10&deg;C<br><em onclick='alert(1)'>(рекомендовано)</em></p>",
      "offers": {
        "@type": "AggregateOffer",
        "url": "https://cher17.com/product/puhovik-ukorochenij-chornij",
        "priceCurrency": "UAH",
        "lowPrice": "7599"
      },
            "additionalProperty": [
            {
          "@type": "PropertyValue",
          "name": "поліестер-100%",
          "value": "Матріал"
        },        {
          "@type": "PropertyValue",
          "name": "молочний",
          "value": "Колір"
    }
      ]
    }
</script>
</head>
<body>
<div class="checkbox-list checkbox-list-product checkbox-list-product_static ">
  <label class="checkbox-list__item" data-type="normal" data-id="30">
    <input class="js-product-size" type="radio" name="sizes" value="30" data-preorder="0">
    <span class="styled-checkbox"></span>
    <span class="checkbox-list__text">XS/S</span>
  </label>
  <label class="checkbox-list__item" data-type="normal" data-id="29">
    <input class="js-product-size" type="radio" name="sizes" value="29" data-preorder="0" disabled>
    <span class="styled-checkbox"></span>
    <span class="checkbox-list__text">M/L</span>
  </label>
  <label class="checkbox-list__item" data-type="normal" data-id="23">
    <input class="js-product-size" type="radio" name="sizes" value="23" data-preorder="0">
    <span class="styled-checkbox"></span>
    <span class="checkbox-list__text">XL</span>
  </label>
</div>
<div class="checkbox-list">
  <label class="checkbox-list__item js-add-to-cart-list" data-type="normal" data-id="30" data-preorder="0">
    <input class="js-product-size" type="radio" name="sizes_fixed" value="30">
    <span class="checkbox-list__text">XS/S</span>
  </label>
  <label class="checkbox-list__item" data-id="30">
    <input class="js-availability-size" type="radio" name="sizes2" value="30" checked >
    <span class="checkbox-list__text">XS/S</span>
  </label>
</div>
<div class="product-main-detail__item accordion">
  <div class="product-main-detail__title accordion-title">склад та догляд</div>
  <div class="product-main-detail__content accordion-content">
    <div class="product-main-detail__box">
      <span class="product-main-detail__name">Матеріал основний: поліестер-100%</span>
      <span class="product-main-detail__name">Підкладка: віскоза-100%</span>
      <span class="product-main-detail__name">Колір: <a href="https://cher17.com/product-category/verhnij-odyag/filter/color_cornij">чорний</a></span>
    </div>
  </div>
</div>
</body>
</html>
