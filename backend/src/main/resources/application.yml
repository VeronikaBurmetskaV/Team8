spring:
  application:
    name: fulla
  # The datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  # (see .env.example); profile dev uses the embedded Postgres instead (DevDatabaseConfig).
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # Image uploads (ADR-0007): 5MB = 5 242 880 bytes per file; a bigger file -> 400 IMAGE_INVALID.
      # The request may be a little larger because of the multipart headers.
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    # No default in-memory user (it logs a generated password); accounts come from our own tables.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

fulla:
  auth:
    # Login + register attempts per minute from one IP address; above it -> 429 (ADR-0006)
    max-attempts-per-minute: 10
  import:
    # Demo catalogue import (ADR-0014): off by default, so tests and other profiles never touch
    # the network. Profile dev turns it on in application-dev.yml.
    enabled: false
  brand-import:
    # Brand site import (ADR-0017), every profile. Hard limits in BrandImportProperties:
    # >= 2 s between requests, <= 50 products and <= 100 requests per import, >= 10 min between
    # two imports of one brand. The bot page must describe FULLA-bot (frontend route, see ADR-0017).
    bot-info-url: https://fulla.example/bot
    delay-between-requests: 2s
    max-products: 50
    max-requests: 100
    min-interval: 10m
    # Automatic sync of brands with a verified site and imported cards (ADR-0017): new products
    # become drafts, changes are applied, products gone from a complete listing become
    # «Немає на сайті». Never below 1 h. application-dev.yml: 1h.
    auto-refresh: true
    sync-interval: 24h
    refresh-check-initial-delay: 5m
    refresh-check-interval: 1h
    # Ownership by the email domain trusts an unverified email (ADR-0017): switch off before
    # anything is published.
    email-domain-verification: true
    # The brand must prove it owns the site before an import (ADR-0017). Only application-dev.yml
    # turns this off (demo mode); profiles prod and ops always require it, whatever is set.
    require-site-verification: true
    verify-min-interval: 30s
    # Public mail services: their domain never verifies a site.
    public-email-domains:
      - gmail.com
      - googlemail.com
      - ukr.net
      - i.ua
      - meta.ua
      - bigmir.net
      - email.ua
      - online.ua
      - outlook.com
      - hotmail.com
      - live.com
      - msn.com
      - yahoo.com
      - icloud.com
      - me.com
      - mail.com
      - gmx.com
      - gmx.net
      - proton.me
      - protonmail.com
      - aol.com
      - zoho.com
      - yandex.ru
      - yandex.ua
      - mail.ru

server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      cookie:
        name: FULLA_SESSION
        http-only: true
        same-site: lax
        max-age: 30d
