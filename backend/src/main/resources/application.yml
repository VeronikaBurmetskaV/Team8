spring:
  application:
    name: fulla
  # The datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  # (see .env.example); profile dev uses the embedded Postgres instead (DevDatabaseConfig).
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # Image uploads (ADR-0007): 5MB = 5 242 880 bytes per file; a bigger file -> 400 IMAGE_INVALID.
      # The request may be a little larger because of the multipart headers.
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    # No default in-memory user (it logs a generated password); accounts come from our own tables.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

fulla:
  auth:
    # Login + register attempts per minute from one IP address; above it -> 429 (ADR-0006)
    max-attempts-per-minute: 10

server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      cookie:
        name: FULLA_SESSION
        http-only: true
        same-site: lax
        max-age: 30d
