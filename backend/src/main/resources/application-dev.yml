# Local development and the laptop demo (profile `dev`, ADR-0010).

fulla:
  auth:
    # Every browser reaches Spring through the Vite proxy (or the cloudflared tunnel), so all
    # visitors arrive from 127.0.0.1 and would share the limit of 10. Without the dev profile
    # the value from application.yml (10) applies.
    max-attempts-per-minute: 1000
  brands:
    # GET /api/brands may show the logo URL the demo import found on a single-brand source
    # site (ADR-0014, ADR-0015). Only here: prod and ops keep the default false.
    source-logos: true
  import:
    # Demo catalogue import (ADR-0014, dev only). Runs ~10 s after start, then checks every
    # 10 min; each source really runs at most once per min-run-interval (1 h here, 6 h by
    # default, never below 10 min; last run stored in catalog_sources).
    # Set to false to start offline. The demo with imported cards is never published.
    enabled: true
    initial-delay: 10s
    check-interval: 10m
    min-run-interval: 1h         # never below 10 min
    delay-between-requests: 2s   # never below 2 s
    max-products-per-source: 50  # never above 50
    max-requests-per-source: 100 # never above 100
    sources:
      vsisvoi: https://vsisvoi.ua
      onebyone: https://onebyone.ua
      cher17: https://cher17.com
